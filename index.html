<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aperta o gatinho 💗</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>

/* Concept: a single-screen night scene. A heart written in "I love you" in 20 languages builds itself over a detailed canvas sky. */
:root {
  --bg: #07030a;
  --ink: #ffe9ee;
  --red: #ff3355;
  --rose: #ff8aa0;
  --violet: #3a1a5e;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
.cap {
  position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; pointer-events: none; opacity: 0; transition: opacity 1.6s ease;
}
.cap.on { opacity: 1; }
.cap b { display: block; font-size: clamp(22px, 6vw, 34px); letter-spacing: .02em; color: var(--ink); text-shadow: 0 0 18px rgba(255,51,85,.7); font-weight: 700; }
.cap span { display: block; margin-top: 6px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--rose); opacity: .75; font-weight: 500; }
button.again {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(14px, env(safe-area-inset-right, 0px));
  background: rgba(255,51,85,.12); color: var(--ink); border: 1px solid rgba(255,138,160,.4);
  border-radius: 999px; padding: 8px 14px; font: 500 12px var(--display); letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
}
button.again:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

html{height:100%}
body{margin:0;height:100%;background:#ffc4d6;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;font-family:var(--display)}
#scene{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
body.love #scene{opacity:1;pointer-events:auto}
#stage{position:fixed;inset:0;z-index:2;background:#ffc4d6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .9s ease}
body.love #stage{opacity:0;pointer-events:none}
#cat{width:min(78vw,380px);cursor:pointer;mix-blend-mode:multiply;transform-origin:50% 100%;display:block;touch-action:manipulation}
#cat.idle{animation:bob 2.6s ease-in-out infinite}
#cat.squish{animation:squish .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes squish{0%{transform:scale(1,1)}25%{transform:scale(1.22,.72)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.05,.96)}100%{transform:scale(1,1)}}
.hint{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:#7a1f3d;opacity:.7;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.pop{position:fixed;z-index:3;font-size:24px;pointer-events:none;will-change:transform,opacity}
button.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(14px,env(safe-area-inset-left,0px));background:rgba(255,51,85,.12);color:var(--ink);border:1px solid rgba(255,138,160,.4);border-radius:999px;padding:8px 14px;font:500 12px var(--display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
button.back:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
</style></head>

<script>

(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var cap = document.getElementById('cap');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var PHRASES = ["I love you","Te amo","Je t'aime","Ti amo","Ich liebe dich","愛してる","사랑해","我爱你","Я тебя люблю","Seni seviyorum","Σ' αγαπώ","Jag älskar dig","Kocham cię","Ik hou van jou","Aku cinta kamu","Anh yêu em","أحبك","मैं तुमसे प्यार करता हूँ","ผมรักคุณ","Mahal kita"];
  var FONT = '"Space Grotesk","Noto Sans","Segoe UI","Noto Sans CJK JP","Noto Sans Arabic","Noto Sans Thai","Noto Sans Devanagari",sans-serif';
  var W, H, dpr, S, cx, cy, heartPath, outline = [], items = [], total = 0;
  var neb, stars = [], bright = [], hearts = [], flies = [], shooters = [], rings = [];
  var t0 = performance.now(), ptr = { x: 0, y: 0, tx: 0, ty: 0 }, lastBeat = -1, nextShoot = 2;
  var BUILD = 9.5;

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function hx(a) { return 16 * Math.pow(Math.sin(a), 3); }
  function hy(a) { return 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a); }

  function buildHeartPath() {
    heartPath = new Path2D(); outline = [];
    for (var i = 0; i <= 360; i++) {
      var a = i / 360 * Math.PI * 2, x = cx + hx(a) * S, y = cy - (hy(a) + 2.5) * S;
      outline.push([x, y]);
      if (i === 0) heartPath.moveTo(x, y); else heartPath.lineTo(x, y);
    }
    heartPath.closePath();
  }
  function distEdge(x, y) {
    var m = 1e9;
    for (var i = 0; i < outline.length; i += 2) { var dx = outline[i][0] - x, dy = outline[i][1] - y, d = dx * dx + dy * dy; if (d < m) m = d; }
    return Math.sqrt(m);
  }
  function inside(x, y) { return ctx.isPointInPath(heartPath, x, y); }

  function layoutText() {
    items = [];
    var fs0 = Math.max(8, S * 0.74), placed = [];
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    var tries = 30000, minX = cx - 17 * S, maxX = cx + 17 * S, minY = cy - 13 * S, maxY = cy + 15 * S;
    for (var n = 0; n < tries; n++) {
      var k = n / tries, cls = k < 0.06 ? 1.5 : k < 0.14 ? 1.2 : k < 0.3 ? 1 : k < 0.6 ? 0.8 : 0.62;
      var size = fs0 * cls * rnd(0.92, 1.08), txt = PHRASES[(Math.random() * PHRASES.length) | 0];
      ctx.font = '700 ' + size.toFixed(1) + 'px ' + FONT;
      var w = ctx.measureText(txt).width, h = size * 1.05, x = rnd(minX, maxX), y = rnd(minY, maxY);
      var x0 = x - w / 2, x1 = x + w / 2, y0 = y - h / 2, y1 = y + h / 2;
      ctx.restore(); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (!(inside(x0, y0) && inside(x1, y0) && inside(x0, y1) && inside(x1, y1) && inside(x, y))) continue;
      var ok = true;
      for (var j = 0; j < placed.length; j++) {
        var p = placed[j];
        if (x0 < p.x1 + 1 && x1 > p.x0 - 1 && y0 < p.y1 && y1 > p.y0) { ok = false; break; }
      }
      if (!ok) continue;
      var e = distEdge(x, y);
      placed.push({ x0: x0, x1: x1, y0: y0, y1: y1 });
      items.push({ txt: txt, x: x, y: y, size: size, edge: e, ang: ((Math.atan2(x - cx, -(y - cy)) + Math.PI * 2) % (Math.PI * 2)),
        hue: rnd(346, 360), lig: rnd(50, 62), ph: rnd(0, 6.28), t: 0 });
    }
    ctx.restore();
    var edgeCut = fs0 * 1.9;
    var ring = items.filter(function (i) { return i.edge < edgeCut; }).sort(function (a, b) { return a.ang - b.ang; });
    var core = items.filter(function (i) { return i.edge >= edgeCut; }).sort(function (a, b) { return (a.edge + rnd(0, S * 2)) - (b.edge + rnd(0, S * 2)); });
    items = ring.concat(core); total = items.length;
    items.forEach(function (it, i) {
      it.t = i < ring.length ? (i / ring.length) * 3.6 + 0.4 : 4 + ((i - ring.length) / Math.max(1, core.length)) * (BUILD - 4);
    });
  }

  function paintNebula() {
    neb = document.createElement('canvas'); neb.width = W * dpr; neb.height = H * dpr;
    var g = neb.getContext('2d'); g.scale(dpr, dpr);
    g.fillStyle = '#07030a'; g.fillRect(0, 0, W, H);
    function blob(x, y, r, c, a) {
      var rg = g.createRadialGradient(x * W, y * H, 0, x * W, y * H, r * Math.max(W, H));
      rg.addColorStop(0, c.replace('A', a)); rg.addColorStop(1, c.replace('A', 0));
      g.fillStyle = rg; g.fillRect(0, 0, W, H);
    }
    blob(0.15, 0.22, 0.55, 'rgba(190,30,80,A)', 0.07);
    blob(0.9, 0.15, 0.5, 'rgba(90,40,170,A)', 0.07);
    blob(0.55, 0.95, 0.7, 'rgba(60,30,120,A)', 0.09);
    blob(0.92, 0.75, 0.4, 'rgba(220,40,110,A)', 0.04);
    blob(0.05, 0.8, 0.35, 'rgba(40,60,160,A)', 0.05);
    blob(0.5, 0.45, 0.45, 'rgba(120,10,40,A)', 0.05);
    // dust lanes
    for (var i = 0; i < 2600; i++) {
      var a = rnd(0, 6.28), r = Math.pow(Math.random(), 0.6) * Math.max(W, H) * 0.7;
      var x = W * 0.3 + Math.cos(a) * r * 1.1 + rnd(-30, 30), y = H * 0.4 + Math.sin(a) * r * 0.55 + rnd(-30, 30);
      g.fillStyle = 'rgba(255,' + ((120 + Math.random() * 80) | 0) + ',' + ((160 + Math.random() * 80) | 0) + ',' + rnd(0.005, 0.02).toFixed(3) + ')';
      g.fillRect(x, y, rnd(0.6, 2), rnd(0.6, 2));
    }
    // hills
    function hill(base, amp, f, col, rim) {
      g.beginPath(); g.moveTo(0, H);
      for (var x = 0; x <= W; x += 6) g.lineTo(x, H * base + Math.sin(x * f) * amp + Math.sin(x * f * 2.3 + 1) * amp * 0.4);
      g.lineTo(W, H); g.closePath(); g.fillStyle = col; g.fill();
      g.strokeStyle = rim; g.lineWidth = 1; g.beginPath();
      for (var x2 = 0; x2 <= W; x2 += 6) { var y = H * base + Math.sin(x2 * f) * amp + Math.sin(x2 * f * 2.3 + 1) * amp * 0.4; if (x2 === 0) g.moveTo(x2, y); else g.lineTo(x2, y); }
      g.stroke();
    }
    hill(0.9, 14, 0.008, '#12061a', 'rgba(255,90,130,0.25)');
    hill(0.94, 10, 0.013, '#0a030f', 'rgba(255,90,130,0.15)');
    hill(0.975, 6, 0.02, '#050208', 'rgba(255,90,130,0.1)');
    // vignette
    var v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.8);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.85)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  }

  function initScene() {
    stars = []; bright = [];
    var n = Math.min(900, (W * H / 1800) | 0);
    for (var i = 0; i < n; i++) {
      var layer = i % 3, s = { x: Math.random() * W, y: Math.random() * H * 0.92, l: layer, r: layer === 0 ? rnd(0.3, 0.7) : layer === 1 ? rnd(0.5, 1) : rnd(0.8, 1.5),
        ph: rnd(0, 6.28), sp: rnd(0.6, 2.4), c: Math.random() < 0.2 ? '255,170,190' : Math.random() < 0.3 ? '190,200,255' : '255,245,245' };
      stars.push(s); if (layer === 2 && Math.random() < 0.28) bright.push(s);
    }
    hearts = [];
    for (var h = 0; h < 26; h++) hearts.push({ x: Math.random() * W, y: Math.random() * H, s: rnd(8, 20), v: rnd(10, 30), ph: rnd(0, 6.28), a: rnd(0.03, 0.09) });
    flies = [];
    for (var f = 0; f < 36; f++) flies.push({ x: Math.random() * W, y: H * rnd(0.7, 0.97), ph: rnd(0, 6.28), sp: rnd(0.4, 1.2), r: rnd(0.8, 1.6) });
  }

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W * 0.9 / 32, H * 0.56 / 29);
    cx = W / 2; cy = H * 0.45;
    buildHeartPath(); layoutText(); paintNebula(); initScene();
  }

  function drawHeartLine(scale, alpha) {
    ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx, -cy);
    ctx.strokeStyle = 'rgba(255,70,100,' + alpha.toFixed(3) + ')'; ctx.lineWidth = 1.5 / scale;
    ctx.stroke(heartPath); ctx.restore();
  }

  function frame(now) {
    var t = reduce ? BUILD + 3 + (now - t0) / 1000 * 0 : (now - t0) / 1000;
    var dt = 1 / 60;
    ptr.x += (ptr.tx - ptr.x) * 0.05; ptr.y += (ptr.ty - ptr.y) * 0.05;
    var drift = reduce ? 0 : now / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(neb, 0, 0, W, H);

    // stars + constellations
    var par = [2, 5, 10];
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], ox = ptr.x * par[s.l] + drift * (s.l + 1) * 0.6, oy = ptr.y * par[s.l];
      var x = ((s.x + ox) % W + W) % W, y = s.y + oy;
      var tw = reduce ? 0.8 : 0.55 + 0.45 * Math.sin(now / 1000 * s.sp + s.ph);
      ctx.fillStyle = 'rgba(' + s.c + ',' + (tw * (0.18 + s.l * 0.1)).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.283); ctx.fill();
      if (s.l === 2 && s.r > 1.2) {
        ctx.strokeStyle = 'rgba(' + s.c + ',' + (tw * 0.35).toFixed(2) + ')'; ctx.lineWidth = 0.6;
        ctx.beginPath(); ctx.moveTo(x - s.r * 4, y); ctx.lineTo(x + s.r * 4, y); ctx.moveTo(x, y - s.r * 4); ctx.lineTo(x, y + s.r * 4); ctx.stroke();
      }
    }
    ctx.lineWidth = 0.6;
    for (var b = 0; b < bright.length; b++) {
      var A = bright[b], ax = ((A.x + ptr.x * 10 + drift * 1.8) % W + W) % W, ay = A.y + ptr.y * 10;
      for (var c = b + 1; c < bright.length; c++) {
        var B = bright[c], bx = ((B.x + ptr.x * 10 + drift * 1.8) % W + W) % W, by = B.y + ptr.y * 10, d = Math.hypot(ax - bx, ay - by);
        if (d < 120) { ctx.strokeStyle = 'rgba(255,170,200,' + (0.04 * (1 - d / 120)).toFixed(3) + ')'; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }
      }
    }

    // shooting stars
    if (!reduce && t > nextShoot) { nextShoot = t + rnd(3, 7); shooters.push({ x: rnd(W * 0.3, W), y: rnd(0, H * 0.35), vx: -rnd(380, 560), vy: rnd(140, 240), life: 0 }); }
    for (var q = shooters.length - 1; q >= 0; q--) {
      var m = shooters[q]; m.life += dt; m.x += m.vx * dt; m.y += m.vy * dt;
      var al = Math.max(0, 1 - m.life / 1.1);
      var gr = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 0.18, m.y - m.vy * 0.18);
      gr.addColorStop(0, 'rgba(255,230,240,' + al + ')'); gr.addColorStop(1, 'rgba(255,100,150,0)');
      ctx.strokeStyle = gr; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 0.18, m.y - m.vy * 0.18); ctx.stroke();
      if (m.life > 1.1) shooters.splice(q, 1);
    }

    // floating hearts
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var hI = 0; hI < hearts.length; hI++) {
      var hh = hearts[hI];
      if (!reduce) { hh.y -= hh.v * dt; if (hh.y < -30) { hh.y = H + 30; hh.x = Math.random() * W; } }
      var sway = reduce ? 0 : Math.sin(now / 1000 * 0.8 + hh.ph) * 14;
      ctx.font = hh.s + 'px ' + FONT;
      ctx.fillStyle = 'rgba(255,80,120,' + hh.a + ')';
      ctx.fillText('♥', hh.x + sway + ptr.x * 6, hh.y + ptr.y * 6);
    }

    // heartbeat
    var built = Math.min(1, t / BUILD), ph = (t % 1.25) / 1.25;
    var beat = t > BUILD ? (Math.exp(-ph * 7) + 0.55 * Math.exp(-Math.pow((ph - 0.22) * 12, 2))) : 0;
    var sc = 1 + (reduce ? 0 : 0.035 * beat + 0.008 * Math.sin(t * 1.6));
    if (!reduce && t > BUILD) { var bi = Math.floor(t / 1.25); if (bi !== lastBeat) { lastBeat = bi; rings.push({ t: t }); } }

    // glow
    ctx.globalCompositeOperation = 'lighter';
    var gr2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 24);
    gr2.addColorStop(0, 'rgba(255,40,80,' + (0.06 + 0.12 * built + 0.08 * beat).toFixed(3) + ')'); gr2.addColorStop(1, 'rgba(255,40,80,0)');
    ctx.fillStyle = gr2; ctx.fillRect(0, 0, W, H);
    for (var r = rings.length - 1; r >= 0; r--) {
      var age = t - rings[r].t; if (age > 2.2) { rings.splice(r, 1); continue; }
      drawHeartLine(1 + age * 0.22, 0.4 * (1 - age / 2.2));
    }
    ctx.globalCompositeOperation = 'source-over';

    // heart text
    ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
    ctx.translate(ptr.x * 3, ptr.y * 3);
    for (var k = 0; k < items.length; k++) {
      var it = items[k], age2 = t - it.t; if (age2 < 0) continue;
      var a = Math.min(1, age2 / 0.5), flash = Math.max(0, 1 - age2 / 0.6);
      var shim = reduce ? 0.9 : 0.88 + 0.12 * Math.sin(t * 1.8 + it.ph);
      var lig = it.lig + flash * 30 + beat * 6;
      ctx.globalAlpha = a * shim;
      ctx.fillStyle = 'hsl(' + it.hue + ',100%,' + Math.min(92, lig).toFixed(0) + '%)';
      var z = 0.6 + 0.4 * a; ctx.font = '700 ' + (it.size * z).toFixed(1) + 'px ' + FONT;
      ctx.fillText(it.txt, it.x, it.y);
    }
    ctx.restore(); ctx.globalAlpha = 1;

    // fireflies
    ctx.globalCompositeOperation = 'lighter';
    for (var f = 0; f < flies.length; f++) {
      var fl = flies[f], fx = fl.x + (reduce ? 0 : Math.sin(now / 1000 * fl.sp + fl.ph) * 18), fy = fl.y + (reduce ? 0 : Math.cos(now / 1000 * fl.sp * 0.8 + fl.ph) * 10);
      var fa = 0.35 + 0.65 * Math.abs(Math.sin(now / 1000 * fl.sp + fl.ph));
      var fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, fl.r * 3.2);
      fg.addColorStop(0, 'rgba(255,200,150,' + (fa * 0.3).toFixed(2) + ')'); fg.addColorStop(1, 'rgba(255,120,120,0)');
      ctx.fillStyle = fg; ctx.fillRect(fx - fl.r * 3.2, fy - fl.r * 3.2, fl.r * 6.4, fl.r * 6.4);
    }
    ctx.globalCompositeOperation = 'source-over';

    if (t > BUILD + 0.5) cap.classList.add('on');
    if (running) raf = requestAnimationFrame(frame);
  }

  function restart() { t0 = performance.now(); lastBeat = -1; rings = []; cap.classList.remove('on'); }
  document.getElementById('again').addEventListener('click', restart);
  window.addEventListener('pointermove', function (e) { ptr.tx = (e.clientX / W - 0.5) * 2; ptr.ty = (e.clientY / H - 0.5) * 2; });
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { resize(); }, 150); });

  var running = false, raf = 0;
  window.__scene = {
    start: function () { if (running) return; running = true; resize(); t0 = performance.now(); lastBeat = -1; rings = []; nextShoot = 2; cap.classList.remove('on'); raf = requestAnimationFrame(frame); },
    stop: function () { running = false; cancelAnimationFrame(raf); cap.classList.remove('on'); }
  };
})();

(function(){
  var cat=document.getElementById('cat'),busy=false;
  function pop(){
    var r=cat.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height*.55;
    for(var i=0;i<18;i++){
      var s=document.createElement('span');s.className='pop';s.textContent=i%3?'💗':'💖';
      s.style.left=ox+'px';s.style.top=oy+'px';document.body.appendChild(s);
      var a=Math.random()*Math.PI*2,d=90+Math.random()*190;
      var an=s.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(a)*d+'px),calc(-50% + '+(Math.sin(a)*d-60)+'px)) scale(1.2)',opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)'});
      an.onfinish=(function(el){return function(){el.remove()}})(s);
    }
  }
  function press(){
    if(busy)return;busy=true;
    cat.classList.remove('idle','squish');void cat.offsetWidth;cat.classList.add('squish');
    if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}
    pop();
    setTimeout(function(){document.body.classList.add('love');window.__scene.start()},750);
  }
  function back(){
    document.body.classList.remove('love');
    setTimeout(function(){window.__scene.stop();cat.classList.remove('squish');cat.classList.add('idle');busy=false},1000);
  }
  cat.addEventListener('click',press);
  document.getElementById('back').addEventListener('click',back);
})();
</script>
</body></html>
